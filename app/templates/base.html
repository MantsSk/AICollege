<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="Learn AI and Programming with an AI Mentor. Practical text-based courses, real projects, and an AI mentor available 24/7." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81',
            },
          },
        },
      },
    };
    // Apply theme before paint to avoid flash.
    (function () {
      const t = localStorage.getItem('theme');
      if (t === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="min-h-screen bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased flex flex-col">
  {% include "partials/nav.html" %}

  <main class="flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
  <footer class="border-t border-slate-200 dark:border-slate-800 mt-16">
    <div class="max-w-6xl mx-auto px-4 py-8 text-sm text-slate-500 dark:text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p>&copy; {{ app_name }}. Learn AI and Programming with an AI Mentor.</p>
      <div class="flex gap-5">
        <a href="/courses" class="hover:text-brand-500">Courses</a>
        <a href="/pricing" class="hover:text-brand-500">Pricing</a>
      </div>
    </div>
  </footer>
  {% endblock %}

  <script src="/static/js/app.js"></script>
</body>
</html>
