{% extends "base.html" %}
{% block title %}{{ _('errors.not_found_title') }} — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-24 text-center">
  <div class="text-6xl font-bold text-brand-500 tabular-nums">404</div>
  <h1 class="mt-4 text-2xl font-bold tracking-tight">{{ _('errors.not_found_h1') }}</h1>
  <p class="mt-3 text-stone-600 dark:text-stone-400">{{ _('errors.not_found_body') }}</p>
  <a href="/" class="mt-8 inline-block px-6 py-3 rounded-lg bg-brand-600 text-white font-semibold hover:bg-brand-700">{{ _('errors.home') }}</a>
</div>
{% endblock %}
