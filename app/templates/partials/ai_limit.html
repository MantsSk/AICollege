<div class="rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-700 dark:text-amber-400 px-3 py-3 text-sm">
  You've reached your daily AI Mentor limit.
  {% if not user.is_subscribed %}
  <form action="/billing/checkout" method="post" class="mt-2">
    <button class="px-3 py-1.5 rounded-lg bg-brand-600 text-white font-semibold text-xs hover:bg-brand-500">Upgrade to Pro for higher limits</button>
  </form>
  {% else %}
  <span>It resets tomorrow.</span>
  {% endif %}
</div>
