{% import "partials/icons.html" as icons %}
{% if completed %}
<div class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-green-500/10 text-green-700 dark:text-green-400 font-semibold">
  {{ icons.icon("check", "h-4 w-4") }}
  {{ _('complete.done') }}
</div>
{% else %}
<form hx-post="/courses/{{ course.slug }}/{{ lesson.slug }}/complete"
      hx-target="#complete-zone" hx-swap="innerHTML" data-complete-gate>
  <button class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-brand-600 text-white font-semibold hover:bg-brand-700">
    <span class="htmx-indicator typing"><span></span><span></span><span></span></span>
    {{ _('complete.mark') }}
  </button>
  <p data-gate-hint class="hidden mt-2 text-sm text-stone-500 dark:text-stone-400">{{ _('complete.hint') }}</p>
</form>
{% endif %}
